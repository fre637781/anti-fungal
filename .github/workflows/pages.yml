name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/happy-johnson-r508ua]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check data/ matches the source document
        run: |
          python3 build/extract.py
          if ! git diff --quiet -- data; then
            echo "::error::data/ is out of date. Run 'python3 build/extract.py' and commit the result."
            git diff --stat -- data
            exit 1
          fi

      # Requires Pages to be enabled for the repository first:
      # Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
      # GITHUB_TOKEN cannot turn it on itself (that needs repo admin rights).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
